<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Malik Peace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --text: #f5f5f7; --mid: rgba(245, 245, 247, .72); --lo: rgba(245, 245, 247, .48);
  --hair: rgba(255, 255, 255, .10); --hair2: rgba(255, 255, 255, .06);
  --cyan: #3ad9f5; --green: #3fd94e; --yt: #ff0033; --dc: #5865F2;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --yt-font: Roboto, Arial, sans-serif;
  --mb: 30px; --ic: clamp(38px, 5.7vh, 54px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: #000; -webkit-text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: #000; color: var(--text); font: 15px/1.45 var(--sys); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ===== wallpaper: Memento's own aurora shader, Frost Aurora colours */
#wall, #wall2 { position: fixed; left: 0; width: 100%; display: block; z-index: 0; background: #000; }
#wall { top: 0; height: 62%; }
#wall2 { bottom: 0; height: 38%; }
body::before { content: ""; position: fixed; left: 0; right: 0; top: 61%; bottom: 37%; background: #000; z-index: 0; }

/* ===== menu bar */
.menubar { position: fixed; top: 0; left: 0; right: 0; height: var(--mb); z-index: 1000; display: flex; align-items: center; gap: 2px;
  padding: 0 12px 0 10px; font-size: 13px; letter-spacing: -.005em;
  background: rgba(0, 0, 0, .34); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); }
.brand { display: inline-flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px 0 4px; border-radius: 6px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.brand img { width: 20px; height: 20px; object-fit: contain; }
.menu { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
.menu a { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; text-decoration: none; color: rgba(245, 245, 247, .9); }
.brand:hover, .menu a:hover { background: rgba(255, 255, 255, .14); }
.clock { margin-left: auto; display: inline-flex; gap: 9px; padding: 0 6px; font-variant-numeric: tabular-nums; color: rgba(245, 245, 247, .92); white-space: nowrap; }

/* ===== desktop */
#desk { position: fixed; inset: 0; z-index: 1; }
#home, .dk-p, .pfade { display: none; }

/* desktop icons (files and folders, top right like macOS) */
.icons { position: absolute; top: calc(var(--mb) + 16px); right: 12px; width: 100px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.di { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px 4px; border: 0; background: none; cursor: default; text-align: center; }
.di .art { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; }
.di .lbl { max-width: 96px; padding: 1px 6px 2px; border-radius: 5px; font: 500 12px/1.3 var(--sys); text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
.di.sel .art { background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.di.sel .lbl { background: rgba(58, 217, 245, .32); text-shadow: none; }
.di:focus-visible { outline: none; }
.di:focus-visible .art { outline: 2px solid var(--cyan); }

.doc { width: 46px; height: 58px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .5)); }
.folder { width: 62px; height: 50px; filter: drop-shadow(0 5px 10px rgba(0, 0, 0, .5)); }
.book { position: relative; width: 42px; height: 60px; border-radius: 2px 5px 5px 2px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 7px 8px;
  background: radial-gradient(120% 70% at 25% 15%, rgba(58, 217, 245, .22), rgba(58, 217, 245, 0) 62%), #050607;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 5px 12px rgba(0, 0, 0, .6); }
.book::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(90deg, rgba(255, 255, 255, .14), rgba(0, 0, 0, .5)); }
.book b { font: 800 13px/1 var(--disp); letter-spacing: -.05em; color: #fff; }
.book b i { font-style: normal; color: var(--cyan); }

/* app icons (dock + phone home) */
.ico { position: relative; width: var(--ic); height: var(--ic); border-radius: 23%; display: grid; place-items: center; flex: none; overflow: hidden;
  background: linear-gradient(180deg, #232327, #09090b); color: #f5f5f7;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .14), 0 6px 16px rgba(0, 0, 0, .45); }
.ico svg { width: 54%; height: 54%; }
.ico img { width: 100%; height: 100%; object-fit: cover; }
.ico.i-hello img { width: 86%; height: 86%; object-fit: contain; margin-top: 10%; }
.ico.i-mem { background: none; box-shadow: 0 6px 16px rgba(0, 0, 0, .45); }
.ico.i-mem::after { content: ""; position: absolute; inset: 0; border-radius: 23%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.ico.i-yt { background: var(--yt); }
.ico.i-dc { background: var(--dc); }
.ico.i-dc svg { width: 58%; }
.ico.i-val svg { color: var(--green); }

/* dock (left edge on a computer, keeps the bottom free) */
.dock { z-index: 900; }
.dk-d { position: fixed; left: 10px; top: calc(50% + var(--mb) / 2); transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 10px;
  border-radius: 22px; background: rgba(30, 30, 34, .38); -webkit-backdrop-filter: blur(36px) saturate(1.6); backdrop-filter: blur(36px) saturate(1.6);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .08), 0 24px 60px rgba(0, 0, 0, .55); }
.dk { position: relative; display: block; padding: 0; border: 0; background: none; cursor: pointer; text-decoration: none; border-radius: 23%; transition: transform .18s var(--ease); }
.dk:hover { transform: scale(1.1); }
.dk:active { transform: scale(.94); }
.dk .tip { position: absolute; left: calc(100% + 16px); top: 50%; transform: translate(-4px, -50%); padding: 5px 10px; border-radius: 7px; white-space: nowrap; pointer-events: none; opacity: 0;
  font: 500 12.5px/1.2 var(--sys); color: var(--text); background: rgba(28, 28, 32, .92); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 20px rgba(0, 0, 0, .5);
  transition: opacity .15s ease-out, transform .15s ease-out; }
.dk:hover .tip, .dk:focus-visible .tip { opacity: 1; transform: translate(0, -50%); }
.dk-d .dk::before { content: ""; position: absolute; left: -7px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: rgba(245, 245, 247, .85); opacity: 0; transition: opacity .2s; }
.dk-d .dk.run::before { opacity: 1; }
.sep { width: 70%; height: 1px; background: rgba(255, 255, 255, .16); margin: 1px 0; }

/* ===== windows */
.win { position: absolute; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; min-width: 300px; min-height: 160px;
  background: rgba(12, 12, 15, .88); -webkit-backdrop-filter: blur(40px) saturate(1.5); backdrop-filter: blur(40px) saturate(1.5);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10), inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 .5px rgba(0, 0, 0, .9), 0 22px 54px rgba(0, 0, 0, .5), 0 6px 16px rgba(0, 0, 0, .35); }
.win.focus { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13), inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 0 .5px rgba(0, 0, 0, .9), 0 38px 90px rgba(0, 0, 0, .68), 0 10px 26px rgba(0, 0, 0, .45); }
.win.anim { transition: left .28s var(--ease), top .28s var(--ease), width .28s var(--ease), height .28s var(--ease); }
.tb { position: relative; flex: none; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 84px; user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); background: rgba(255, 255, 255, .025); }
.lights { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.l { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: default; background: rgba(255, 255, 255, .2); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .3); }
.l svg { width: 8px; height: 8px; opacity: 0; color: rgba(0, 0, 0, .62); transition: opacity .12s; }
.win.focus .l-close { background: #ff5f57; } .win.focus .l-min { background: #febc2e; } .win.focus .l-zoom { background: #28c840; }
.lights:hover .l-close { background: #ff5f57; } .lights:hover .l-min { background: #febc2e; } .lights:hover .l-zoom { background: #28c840; }
.lights:hover .l svg, .l:focus-visible svg { opacity: 1; }
.ttl { font: 600 13px/1 var(--sys); color: rgba(245, 245, 247, .86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win:not(.focus) .ttl { color: rgba(245, 245, 247, .42); }
.back { display: none; }
.body { position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; container-type: inline-size; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
.body::-webkit-scrollbar { width: 10px; } .body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; z-index: 3; }
.win.moving { user-select: none; -webkit-user-select: none; }

/* ===== shared content pieces */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; padding: 0 16px; border-radius: 10px; font: 600 15px/1 var(--sys); color: #fff; text-decoration: none; white-space: nowrap; transition: filter .15s, transform .15s; }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(.98); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.dc svg { width: 20px; height: 16px; }
.btn.yt { background: var(--yt); }
.btn.dc { background: var(--dc); }
.btn.ghost { background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.mf { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; max-width: 520px; }
.mf input { flex: 1 1 190px; min-width: 0; height: 46px; padding: 0 14px; border: 0; border-radius: 10px; font: 16px var(--sys); color: var(--text); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13); }
.mf input::placeholder { color: rgba(245, 245, 247, .42); }
.mf input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.mf button { flex: none; height: 46px; padding: 0 18px; border: 0; border-radius: 10px; font: 600 15px var(--sys); color: #0a0a0b; background: #f5f5f7; cursor: pointer; white-space: nowrap; }
.mf button:hover { background: #fff; }
.fine { margin: 10px 0 0; font-size: 13px; color: var(--lo); }
.done { margin: 8px 0 0; font-size: 13.5px; color: var(--cyan); }
.done a { color: var(--text); text-underline-offset: 3px; }

/* hello */
.hello { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; align-content: center; gap: clamp(14px, 3cqw, 40px); min-height: 100%; padding: clamp(22px, 4.6cqw, 56px); }
.hello h1 { font: 700 clamp(34px, 6.9cqw, 84px)/.98 var(--disp); letter-spacing: -.042em; }
.lede { margin: clamp(14px, 2.4cqw, 22px) 0 clamp(20px, 3.2cqw, 30px); font-size: clamp(16px, 2.4cqw, 20px); line-height: 1.5; color: var(--mid); max-width: 30em; }
.lede a { color: var(--text); text-decoration: underline; text-decoration-color: var(--cyan); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.face { height: clamp(160px, 35cqw, 420px); width: auto; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .55)); }
.hello .btns { gap: 8px; }
.hello .btn { padding: 0 15px; font-size: 14.5px; }
@container (max-width: 560px) {
  .hello { grid-template-columns: 1fr; }
  .hello .face { order: -1; height: 150px; }
}

/* mission.txt */
.mission { padding: clamp(22px, 5.4cqw, 48px); }
.mission h2 { font: 700 clamp(26px, 6.2cqw, 54px)/1.04 var(--disp); letter-spacing: -.034em; margin-bottom: clamp(12px, 2.4cqw, 18px); }
.mission p { margin: 0; font-size: clamp(15px, 3.3cqw, 19px); line-height: 1.6; color: var(--mid); max-width: 34em; }

/* comments */
.cm { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head btn" "rows rows" "list list"; align-items: start; padding: 18px 0 18px; }
.cm-head { grid-area: head; padding: 0 20px; min-width: 0; }
.cm-head h2 { font: 700 clamp(19px, 3cqw, 26px)/1.15 var(--disp); letter-spacing: -.022em; }
.note { margin: 5px 0 0; font-size: 12.5px; color: var(--lo); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 15px; border: 0; border-radius: 999px; cursor: pointer; font: 600 14px/1 var(--sys); color: #0a0a0b; background: #f5f5f7; white-space: nowrap; }
.pill:hover { background: #fff; }
.pill svg { width: 13px; height: 13px; }
.cm-btn { grid-area: btn; margin: 2px 20px 0 0; }
.cm-rows { grid-area: rows; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.row { display: flex; width: max-content; animation: mq var(--dur, 300s) linear infinite; }
.row.rev { animation-direction: reverse; }
.row .set { display: flex; }
.cm-rows:hover .row, .w-cm:hover .row { animation-play-state: paused; }
@keyframes mq { to { transform: translateX(-50%); } }
.cm-list { grid-area: list; display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px 8px; }
.cm-list .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.sent { height: 1px; grid-column: 1 / -1; grid-row: 9; }

.yc { --av: 36px; flex: none; width: 300px; height: 122px; margin-right: 8px; display: grid; grid-template-columns: var(--av) minmax(0, 1fr); gap: 12px; padding: 12px 14px 10px;
  border-radius: 12px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); font-family: var(--yt-font); color: #f1f1f1; text-align: left; }
.yc .av { width: var(--av); height: var(--av); border-radius: 50%; background: #2a2a2e url(../assets/av-sprite.jpg) no-repeat;
  background-size: calc(var(--av) * 32) auto; background-position: calc(var(--sx) * var(--av) * -1) calc(var(--sy) * var(--av) * -1); }
.yc .bd { min-width: 0; display: flex; flex-direction: column; }
.yc .hd { font-size: 12.5px; font-weight: 500; line-height: 16px; letter-spacing: .01em; }
.yc .tx { margin: 2px 0 0; font-size: 14px; line-height: 20px; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.yc .ac { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 6px; }
.yc .ac svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
.yc .ct { font-size: 12px; color: #aaa; margin-right: 8px; font-variant-numeric: tabular-nums; }
.yc .dn { display: inline-flex; transform: rotate(180deg); }
.yc .rp { font-size: 12px; font-weight: 500; margin-left: 10px; }
#cm-rows .yc { height: var(--ch, 122px); }
#cm-rows .yc .tx { -webkit-line-clamp: var(--lines, 3); }
.cm-list .yc { width: auto; height: auto; margin: 0; }
.cm-list .yc .tx { display: block; -webkit-line-clamp: unset; overflow: visible; }

/* consistent focused action. */
.val { max-width: 780px; margin: 0 auto; padding: clamp(28px, 6cqw, 70px) clamp(22px, 5.5cqw, 56px) 64px; }
.bridge { margin: 0; font-size: clamp(17px, 2.6cqw, 21px); line-height: 1.55; color: var(--mid); }
.aside { font-size: .74em; color: var(--lo); }
.statement { margin: clamp(22px, 4cqw, 36px) 0 clamp(22px, 4cqw, 36px); font: 800 clamp(50px, 13.4cqw, 132px)/.9 var(--disp); letter-spacing: -.055em; }
.intro { margin: 0; font-size: clamp(16px, 2.4cqw, 19px); line-height: 1.62; color: var(--mid); max-width: 36em; }
.lockin { margin: clamp(44px, 8cqw, 72px) 0 20px; font: 700 clamp(24px, 4.4cqw, 38px)/1.14 var(--disp); letter-spacing: -.028em; max-width: 20em; }
.lockin em { font-style: italic; }
.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.step { border-bottom: 1px solid var(--hair); cursor: pointer; transition: background .2s; }
.step:not(.open):hover { background: rgba(255, 255, 255, .025); }
.step.open { cursor: auto; }
.step-h { display: grid; grid-template-columns: clamp(36px, 7cqw, 64px) minmax(0, 1fr); column-gap: 10px; width: 100%; padding: 20px 4px 20px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.step-h .n { grid-row: 1 / span 3; font: 700 clamp(20px, 3.2cqw, 28px)/1.1 var(--disp); color: var(--lo); font-variant-numeric: tabular-nums; }
.step-h .nm { font: 700 clamp(20px, 3.2cqw, 28px)/1.1 var(--disp); letter-spacing: -.024em; }
.step-h .ld { margin-top: 6px; font-size: clamp(15px, 2.3cqw, 17px); line-height: 1.5; color: var(--mid); }
.rm, .sl { justify-self: start; margin-top: 10px; padding: 0; border: 0; background: none; font: 600 14px/1.2 var(--sys); color: var(--text); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 4px; cursor: pointer; }
.step.open .rm { display: none; }
.step-b { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .34s var(--ease), visibility 0s linear .34s; }
.step.open .step-b { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .34s var(--ease); }
.step-b > div { overflow: hidden; padding-left: calc(clamp(36px, 7cqw, 64px) + 10px); }
.step-b p { margin: 0; font-size: clamp(15px, 2.3cqw, 17px); line-height: 1.65; color: rgba(245, 245, 247, .82); max-width: 38em; }
.sl { margin: 14px 0 22px; }

/* tools */
.tools { padding: clamp(22px, 4.4cqw, 48px); }
.tools-h h2 { font: 700 clamp(24px, 3.9cqw, 42px)/1.08 var(--disp); letter-spacing: -.03em; max-width: 22em; }
.tools-h p { margin: 10px 0 0; color: var(--mid); font-size: clamp(15px, 2cqw, 17px); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: clamp(20px, 3cqw, 30px); }
.tcard { position: relative; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, .035); }
.tcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); pointer-events: none; }
.vis { position: relative; height: 230px; display: grid; place-items: center; background: #000; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); }
.wk { position: absolute; inset: 24px 24px 0; width: calc(100% - 48px); height: calc(100% - 24px);
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }
.mc-sm { width: 112px; }
.fx { width: calc(100% - 44px); display: flex; flex-direction: column; align-items: flex-start; }
.fx .tag { font: 600 11.5px/1 var(--sys); padding: 6px 9px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--mid); }
.fx .lab { margin-top: 12px; font-size: 14px; color: var(--mid); }
.fx b { margin-top: 4px; font: 700 clamp(34px, 4.2cqw, 44px)/1.05 var(--disp); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.fx .bar { width: 100%; height: 6px; margin-top: 14px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.fx .bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
.fx .cap { margin-top: 10px; font-size: 13.5px; color: var(--mid); }
.tc-tx { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 18px 18px 20px; }
.tc-tx h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font: 700 21px/1.15 var(--disp); letter-spacing: -.02em; }

      return '<div class="row' + (k % 2 ? ' rev' : '') + '" style="--dur:' + dur + 's"><div class="set">' + r.join('') + '</div><div class="set" aria-hidden="true">' + r.join('') + '</div></div>';
    }).join('');
    box.setAttribute('data-n', n);
  }
  function buildWinRows() {
    var box = $('#cm-rows'); if (!box || box.hidden) return;
    var s = WIN.comments, n, ch = 122;
    if (phone) n = 4;
    else {
      var avail = s.body.clientHeight - box.offsetTop - 14;
      n = clamp(Math.round((avail + 8) / 140), 1, 5);
      ch = clamp(Math.floor((avail - (n - 1) * 8) / n), 106, 190);
    }
    box.style.setProperty('--ch', ch + 'px');
    box.style.setProperty('--lines', clamp(Math.floor((ch - 62) / 20), 2, 6));
    if (+box.getAttribute('data-n') === n) return;
    buildRows(box, n, C.slice(0, n * 26), 308);
  }
  buildRows($('#w-cm .cm-rows'), 2, C.slice(0, 44), 260);

  var listSt = null, listIO = null;
  function layoutList() {
    var box = $('#cm-list'), w = box.clientWidth - 40, n = clamp(Math.floor((w + 12) / 290), 1, 4);
    if (listSt && listSt.n === n) return;
    var keep = listSt ? listSt.i : 72;
    box.innerHTML = ''; listSt = { n: n, cols: [], hs: [], i: 0, cw: Math.max(240, (w - (n - 1) * 12) / n) };
    for (var k = 0; k < n; k++) { var d = document.createElement('div'); d.className = 'col'; box.appendChild(d); listSt.cols.push(d); listSt.hs.push(0); }
    appendChunk(keep);
    var sent = document.createElement('div'); sent.className = 'sent'; box.parentNode.appendChild(sent);
    $$('.sent').forEach(function (x) { if (x !== sent) x.remove(); });
    if (listIO) listIO.disconnect();
    listIO = new IntersectionObserver(function (es) {
      if (!es[0].isIntersecting) return;
      if (listSt.i >= N) { listIO.disconnect(); return; }
      appendChunk(72); listIO.unobserve(sent); listIO.observe(sent);
    }, { root: WIN.comments.body, rootMargin: '0px 0px 1200px 0px' });
    listIO.observe(sent);
  }
  function appendChunk(k) {
    var st = listSt, end = Math.min(N, st.i + k), per = st.cw / 7.4, frag = st.cols.map(function () { return ''; });
    for (; st.i < end; st.i++) {
      var c = C[st.i], j = 0;
      for (var q = 1; q < st.n; q++) if (st.hs[q] < st.hs[j]) j = q;
      frag[j] += ytCard(c);
      st.hs[j] += 74 + Math.ceil(c.t.length / per + (c.t.split('\n').length - 1)) * 20;
    }
    st.cols.forEach(function (col, q) { if (frag[q]) col.insertAdjacentHTML('beforeend', frag[q]); });
  }
  $('#cm-all').addEventListener('click', function () {
    var s = WIN.comments;
    $('#cm-rows').hidden = true; this.hidden = true; $('#cm-list').hidden = false;
    if (!phone && !s.max) zoom(s);
    layoutList();
    s.body.scrollTop = 0;
    var f = $('#cm-list .yc'); if (f) f.setAttribute('tabindex', '-1');
  });

  /* ---------- steps: tap anywhere on a step to open, Show less closes */
  $$('.step').forEach(function (st) {
    var h = st.querySelector('.step-h');
    function set(open) { st.classList.toggle('open', open); h.setAttribute('aria-expanded', open); }
    st.addEventListener('click', function (e) {
      if (e.target.closest('.sl')) { set(false); h.focus({ preventScroll: true }); return; }
      if (e.target.closest('.step-h')) { set(!st.classList.contains('open')); return; }
      if (!st.classList.contains('open')) set(true);
    });
  });

  /* ---------- forms are mockups */
  $$('form.mf').forEach(function (f) {
    f.addEventListener('submit', function (e) { e.preventDefault(); var d = f.parentNode.querySelector('.done'); if (d) d.hidden = false; });
  });

  /* ---------- the life audit: a life in weeks */
  function drawAudit(cv) {
    var w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    var d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    var x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
    var cols = 52, p = w / cols, rows = Math.floor(h / p), r = Math.max(0.7, p * 0.25), lived = Math.round(rows * cols * 0.34);
    for (var i = 0; i < rows * cols; i++) {
      var cx = (i % cols + 0.5) * p, cy = (Math.floor(i / cols) + 0.5) * p;
      x.fillStyle = i < lived ? 'rgba(245,245,247,.9)' : i === lived ? '#3ad9f5' : 'rgba(245,245,247,.17)';
      x.beginPath(); x.arc(cx, cy, i === lived ? r * 1.45 : r, 0, 6.2832); x.fill();
    }
  }
  if ('ResizeObserver' in window) {
    var aro = new ResizeObserver(function (es) { es.forEach(function (e) { drawAudit(e.target); }); });
    $$('canvas.wk').forEach(function (c) { aro.observe(c); });
  }

  /* ---------- clicks: icons, dock, nav */
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) { e.preventDefault(); $$('.di.sel').forEach(function (d) { d.classList.remove('sel'); }); if (o.classList.contains('di')) o.classList.add('sel'); openWin(o.getAttribute('data-open'), o); return; }
    var nv = e.target.closest('[data-nav]');
    if (nv) {
      e.preventDefault();
      var k = nv.getAttribute('data-nav');
      if (phone) {
        if (cur) closeSheet();
        if (k === 'memento') openSheet('memento', nv);
        else if (k === 'about') $('#slot-mission').scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'center' });
        else window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' });
      } else {
        if (k === 'memento') openWin('memento', nv);
        else if (k === 'about') { openWin('hello', nv); openWin('mission', nv); }
        else restLayout(true);
      }
      return;
    }
    if (!e.target.closest('.di')) $$('.di.sel').forEach(function (d) { d.classList.remove('sel'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && phone && cur) phoneBack();
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.hasAttribute('data-open')) { e.preventDefault(); t.click(); }
  });

  /* ---------- mode: desktop windows or phone home screen */
  function applyMode() {
    phone = mq.matches;
    if (cur) closeSheet(true);
    if (phone) {
      $('#slot-hello').appendChild(slotHello); $('#slot-mission').appendChild(slotMission);
      Object.keys(WIN).forEach(function (k) { var s = WIN[k]; s.open = false; s.min = false; s.el.hidden = true; s.el.classList.remove('focus'); });
    } else {
      WIN.hello.body.appendChild(slotHello); WIN.mission.body.appendChild(slotMission);
      restLayout(false);
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', applyMode); else mq.addListener(applyMode);
  var rz = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      if (phone) { if (cur === 'comments' && listSt) layoutList(); return; }
      if (!touched) { restLayout(false); return; }
      var g = region();
      Object.keys(WIN).forEach(function (k) {
        var s = WIN[k]; if (!s.g) return;
        if (s.max) s.g = { x: g.L, y: g.T, w: g.w, h: g.h };
        s.g.w = Math.min(s.g.w, window.innerWidth - 20); s.g.h = Math.min(s.g.h, window.innerHeight - 40);
        s.g.x = clamp(s.g.x, -s.g.w + 140, window.innerWidth - 140); s.g.y = clamp(s.g.y, 30, window.innerHeight - 44);
        place(s); if (s.open) afterSize(s);
      });
    }, 120);
  });

  /* ---------- live clock */
  function tick() {
    var d = new Date();
    $('#clk-d').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
    $('#clk-t').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    $('#clock').setAttribute('datetime', d.toISOString());
    setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  }
  tick();

  /* ---------- boot */
  applyMode();
  if (window.MEMENTO7) MEMENTO7.mount();
  if (window.ML && ML.Sky) {
    try {
      var cols = ML.skyColors(MEMENTO7.AURORA_FROST);
      var sky = ML.Sky($('#wall'), { scale: 0.5, amp: 0.66, gain: 0.74, fadeFrom: 0.98, fadeTo: 0.34 });
      if (sky.set) sky.set(cols, 0.66);
      var floor = ML.Sky($('#wall2'), { scale: 0.5, amp: 0.42, gain: 0.7, floor: true, fadeFrom: 0.98, fadeTo: 0.4 });
      if (floor.set) floor.set([cols[2], cols[1], cols[0]], 0.42);
    } catch (e) {}
  }
})();
</script>

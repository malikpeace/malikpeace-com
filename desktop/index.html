<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Malik Peace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --text: #f5f5f7; --mid: rgba(245, 245, 247, .72); --lo: rgba(245, 245, 247, .48);
  --hair: rgba(255, 255, 255, .10); --hair2: rgba(255, 255, 255, .06);
  --cyan: #3ad9f5; --green: #3fd94e; --yt: #ff0033; --dc: #5865F2;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --yt-font: Roboto, Arial, sans-serif;
  --mb: 30px; --ic: clamp(38px, 5.6vh, 54px);
  --dock-b: calc(var(--safe-b) + 10px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --glass: rgba(34, 34, 39, .62);
  color-scheme: dark;
}
html.has-sw { --dock-b: calc(var(--safe-b) + 64px); }
* { box-sizing: border-box; }
html { background: #000; -webkit-text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: #000; color: var(--text); font: 15px/1.45 var(--sys); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ===== wallpaper: drawn on a canvas at load (rolling hill on a computer, rain on glass on a phone) */
#wall { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; z-index: 0; background: #2f74cf; }
.wfade { display: none; }

/* the shared avatar crop: same maths at every size */
.sprite { display: block; flex: none; width: var(--av); height: var(--av); border-radius: 50%; background: #2a2a2e url(../assets/av-sprite.jpg) no-repeat;
  background-size: calc(var(--av) * 32) auto; background-position: calc(var(--sx) * var(--av) * -1) calc(var(--sy) * var(--av) * -1); }

/* ===== menu bar */
.menubar { position: fixed; top: 0; left: 0; right: 0; height: var(--mb); z-index: 1000; display: flex; align-items: center; gap: 2px;
  padding: 0 10px 0 8px; font-size: 13px; letter-spacing: -.005em; user-select: none; -webkit-user-select: none;
  background: rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); }
.brand { display: inline-flex; align-items: center; gap: 8px; height: 22px; padding: 0 9px 0 5px; border: 0; border-radius: 6px; background: none; font-weight: 700; white-space: nowrap; cursor: default; }
.brand img { width: 18px; height: 18px; object-fit: contain; }
.menu { display: flex; align-items: center; gap: 1px; margin-left: 4px; }
.menu a { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; text-decoration: none; color: rgba(245, 245, 247, .9); cursor: default; }
.brand:hover, .brand[aria-expanded="true"], .menu a:hover { background: rgba(255, 255, 255, .15); }
.mb-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.mb-ic { width: 30px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: none; display: grid; place-items: center; color: rgba(245, 245, 247, .92); cursor: default; }
.mb-ic:hover, .mb-ic[aria-expanded="true"] { background: rgba(255, 255, 255, .15); }
.mb-ic svg { width: 15px; height: 15px; }
.clock { display: inline-flex; gap: 8px; height: 22px; align-items: center; padding: 0 7px; border-radius: 6px; font-variant-numeric: tabular-nums; color: rgba(245, 245, 247, .94); white-space: nowrap; }
.menubar .exitd { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; margin: 0 4px; border-radius: 999px; font: 600 12px/1 var(--sys); white-space: nowrap; text-decoration: none;
  color: #0a0a0b; background: rgba(245, 245, 247, .92); }
.menubar .exitd:hover { background: #fff; }

/* menus (menu bar + right click) */
.ctx { position: fixed; z-index: 4000; min-width: 230px; padding: 5px; border-radius: 11px; font: 13px/1 var(--sys); color: var(--text);
  background: rgba(38, 38, 43, .74); -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2), 0 0 0 .5px rgba(0, 0, 0, .7), 0 16px 44px rgba(0, 0, 0, .5); }
.ctx button { display: flex; align-items: center; gap: 10px; width: 100%; height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: default; white-space: nowrap; }
.ctx button:hover, .ctx button:focus-visible { background: rgba(255, 255, 255, .16); outline: none; }
.ctx kbd { margin-left: auto; padding-left: 24px; font: 13px/1 var(--sys); color: rgba(245, 245, 247, .45); }
.ctx .sep { height: 1px; margin: 5px 10px; background: rgba(255, 255, 255, .12); }

/* ===== desktop */
#desk { position: fixed; inset: 0; z-index: 1; }
#home, .dk-p, .pfade, .pbar { display: none; }

/* desktop icons (files and folders, top right like macOS) */
.icons { position: absolute; top: calc(var(--mb) + 16px); right: 12px; width: 100px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.di { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px 4px; border: 0; background: none; cursor: default; text-align: center; color: var(--text); }
.di .art { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; }
.di .lbl { max-width: 96px; padding: 1px 6px 2px; border-radius: 5px; font: 500 12px/1.3 var(--sys); text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
.di.sel .art { background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.di.sel .lbl { background: rgba(58, 217, 245, .32); text-shadow: none; }
.di:focus-visible { outline: none; }
.di:focus-visible .art { outline: 2px solid var(--cyan); }
.doc { width: 46px; height: 58px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .5)); }
.folder { width: 62px; height: 50px; filter: drop-shadow(0 5px 10px rgba(0, 0, 0, .5)); }
.book { position: relative; width: 42px; height: 60px; border-radius: 2px 5px 5px 2px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 7px 7px;
  background: radial-gradient(120% 70% at 25% 15%, rgba(58, 217, 245, .22), rgba(58, 217, 245, 0) 62%), #050607;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 5px 12px rgba(0, 0, 0, .6); }
.book::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(90deg, rgba(255, 255, 255, .14), rgba(0, 0, 0, .5)); }
.book b { font: 800 13px/1 var(--disp); letter-spacing: -.05em; color: #fff; }
.book b i { font-style: normal; color: var(--cyan); }

/* app icons (dock + phone home) */
.ico { position: relative; width: var(--ic); height: var(--ic); border-radius: 23%; display: grid; place-items: center; flex: none; overflow: hidden;
  background: linear-gradient(180deg, #26262b, #09090b); color: #f5f5f7;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .16), 0 6px 16px rgba(0, 0, 0, .45); }
.ico svg { width: 54%; height: 54%; }
.ico img { width: 100%; height: 100%; object-fit: cover; }
.ico.i-hello img { width: 86%; height: 86%; object-fit: contain; margin-top: 10%; }
.ico.i-mem { background: none; box-shadow: 0 6px 16px rgba(0, 0, 0, .45); }
.ico.i-mem::after { content: ""; position: absolute; inset: 0; border-radius: 23%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.ico.i-yt { background: var(--yt); }
.ico.i-dc { background: var(--dc); }
.ico.i-dc svg { width: 58%; }
.ico.i-val svg { color: var(--green); }
.ico.i-trash { background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ico .book { width: 54%; height: 70%; padding: 0 0 5px 6px; }
.ico .book b { font-size: 10.5px; }

/* dock (left edge on a computer, magnifies like macOS) */
.dock { z-index: 900; }
.dk-d { position: fixed; left: 10px; top: calc(50% + var(--mb) / 2); transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: 10px; --g: 0px; }
.dk-d::before { content: ""; position: absolute; left: 0; right: 0; top: calc(var(--g) / -2); bottom: calc(var(--g) / -2); border-radius: 22px; z-index: -1;
  background: rgba(30, 30, 34, .4); -webkit-backdrop-filter: blur(36px) saturate(1.7); backdrop-filter: blur(36px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .08), 0 24px 60px rgba(0, 0, 0, .55); transition: top .25s var(--ease), bottom .25s var(--ease); }
.dk-d.mag::before { transition: top 80ms linear, bottom 80ms linear; }
.dk-d .dock-it { transform-origin: 0 50%; transition: transform .25s var(--ease); }
.dk-d.mag .dock-it { transition: transform 80ms linear; }
.dk { position: relative; display: block; padding: 0; border: 0; background: none; cursor: default; text-decoration: none; border-radius: 23%; }
.dk:active .ico { filter: brightness(.72); }
.dk-d .dk::before { content: ""; position: absolute; left: -7px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: rgba(245, 245, 247, .85); opacity: 0; transition: opacity .2s; }
.dk-d .dk.run::before { opacity: 1; }
.sep { width: var(--ic); height: 1px; background: rgba(255, 255, 255, .16); margin: 1px 0; }
.dtip { position: fixed; z-index: 3000; padding: 5px 10px; border-radius: 7px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-4px, -50%);
  font: 500 12.5px/1.2 var(--sys); color: var(--text); background: rgba(34, 34, 38, .92); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2), 0 8px 20px rgba(0, 0, 0, .5);
  transition: opacity .12s ease-out, transform .12s ease-out; }
.dtip.on { opacity: 1; transform: translate(0, -50%); }

/* ===== windows */
.win { position: absolute; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; min-width: 300px; min-height: 160px;
  background: rgba(12, 12, 15, .88); -webkit-backdrop-filter: blur(40px) saturate(1.5); backdrop-filter: blur(40px) saturate(1.5);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09), inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 .5px rgba(0, 0, 0, .9), 0 18px 44px rgba(0, 0, 0, .42), 0 4px 12px rgba(0, 0, 0, .3); }
.win.focus { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13), inset 0 1px 0 rgba(255, 255, 255, .1), 0 0 0 .5px rgba(0, 0, 0, .9), 0 40px 100px rgba(0, 0, 0, .7), 0 12px 30px rgba(0, 0, 0, .45); }
.win.anim { transition: left .3s var(--ease), top .3s var(--ease), width .3s var(--ease), height .3s var(--ease); }
.tb { position: relative; flex: none; height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 84px; user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .02)); }
.win:not(.focus) .tb { background: rgba(255, 255, 255, .015); }
.lights { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.l { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: default; background: rgba(255, 255, 255, .2); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .3); }
.l svg { width: 8px; height: 8px; opacity: 0; color: rgba(0, 0, 0, .62); transition: opacity .12s; }
.win.focus .l-close, .lights:hover .l-close { background: #ff5f57; }
.win.focus .l-min, .lights:hover .l-min { background: #febc2e; }
.win.focus .l-zoom, .lights:hover .l-zoom { background: #28c840; }
.lights:hover .l svg, .l:focus-visible svg { opacity: 1; }
.ttl { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font: 600 13px/1 var(--sys); color: rgba(245, 245, 247, .86); white-space: nowrap; }
.ttl-t { overflow: hidden; text-overflow: ellipsis; }
.ttl .px { display: inline-grid; place-items: center; width: 14px; height: 16px; flex: none; }
.ttl .px svg { width: 12px; height: 15px; }
.win:not(.focus) .ttl { color: rgba(245, 245, 247, .42); }
.win:not(.focus) .ttl .px { opacity: .5; }
.back { display: none; }
.body { position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; container-type: inline-size; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
.body::-webkit-scrollbar, .fd-main::-webkit-scrollbar, .sp-res::-webkit-scrollbar { width: 10px; }
.body::-webkit-scrollbar-thumb, .fd-main::-webkit-scrollbar-thumb, .sp-res::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; z-index: 3; }
.win.moving { user-select: none; -webkit-user-select: none; }
.snap { position: absolute; z-index: 9; border-radius: 12px; opacity: 0; pointer-events: none;
  background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24), 0 20px 50px rgba(0, 0, 0, .3);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  transition: opacity .16s, left .18s var(--ease), top .18s var(--ease), width .18s var(--ease), height .18s var(--ease); }
.snap.on { opacity: 1; }
.hit { animation: hit 1.8s ease-out; border-radius: 10px; }
@keyframes hit { 0%, 30% { box-shadow: 0 0 0 2px rgba(58, 217, 245, .9), 0 0 0 8px rgba(58, 217, 245, .16); } 100% { box-shadow: 0 0 0 2px rgba(58, 217, 245, 0), 0 0 0 8px rgba(58, 217, 245, 0); } }

/* ===== shared content pieces */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; padding: 0 16px; border-radius: 10px; font: 600 15px/1 var(--sys); color: #fff; text-decoration: none; white-space: nowrap; transition: filter .15s, transform .15s; }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(.98); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.dc svg { width: 20px; height: 16px; }
.btn.yt { background: var(--yt); }
.btn.dc { background: var(--dc); }
.btn.ghost { background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.mf { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; max-width: 520px; }
.mf input { flex: 1 1 190px; min-width: 0; height: 46px; padding: 0 14px; border: 0; border-radius: 10px; font: 16px var(--sys); color: var(--text); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13); }
.mf input::placeholder { color: rgba(245, 245, 247, .42); }
.mf input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.mf button { flex: none; height: 46px; padding: 0 18px; border: 0; border-radius: 10px; font: 600 15px var(--sys); color: #0a0a0b; background: #f5f5f7; cursor: pointer; white-space: nowrap; }
.mf button:hover { background: #fff; }
.fine { margin: 10px 0 0; font-size: 13px; color: var(--lo); }
.done { margin: 8px 0 0; font-size: 13.5px; color: var(--cyan); }
.done a { color: var(--text); text-underline-offset: 3px; }

/* hello */
.hello { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; align-content: center; gap: clamp(14px, 3cqw, 40px); min-height: 100%; padding: clamp(22px, 4.6cqw, 56px); }
.hello h1 { font: 700 clamp(34px, 6.9cqw, 84px)/.98 var(--disp); letter-spacing: -.042em; }
.lede { margin: clamp(14px, 2.4cqw, 22px) 0 clamp(20px, 3.2cqw, 30px); font-size: clamp(16px, 2.4cqw, 20px); line-height: 1.5; color: var(--mid); max-width: 30em; }
.lede a { color: var(--text); text-decoration: underline; text-decoration-color: var(--cyan); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.face { height: clamp(160px, 35cqw, 420px); width: auto; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .55)); }
.hello .btns { gap: 8px; }
.hello .btn { padding: 0 15px; font-size: 14.5px; }
@container (max-width: 560px) {
  .hello { grid-template-columns: 1fr; }
  .hello .face { order: -1; height: 150px; }
}

/* mission.txt */
.mission { padding: clamp(22px, 5.4cqw, 48px); }
.mission h2 { font: 700 clamp(26px, 6.2cqw, 54px)/1.04 var(--disp); letter-spacing: -.034em; margin-bottom: clamp(12px, 2.4cqw, 18px); }
.mission p { margin: 0; font-size: clamp(15px, 3.3cqw, 19px); line-height: 1.6; color: var(--mid); max-width: 34em; }

/* comments */
.cm { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head btn" "pin pin" "rows rows" "list list"; align-items: start; padding: 18px 0 18px; }
.cm-head { grid-area: head; padding: 0 20px; min-width: 0; }
.cm-head h2 { font: 700 clamp(19px, 3cqw, 26px)/1.15 var(--disp); letter-spacing: -.022em; }
.note { margin: 5px 0 0; font-size: 12.5px; color: var(--lo); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 15px; border: 0; border-radius: 999px; cursor: pointer; font: 600 14px/1 var(--sys); color: #0a0a0b; background: #f5f5f7; white-space: nowrap; }
.pill:hover { background: #fff; }
.pill svg { width: 13px; height: 13px; }
.cm-btn { grid-area: btn; margin: 2px 20px 0 0; }
.cm-pin { grid-area: pin; position: relative; margin: 16px 20px 0; }
.cm-pin .yc { width: auto; height: auto; margin: 0; background: rgba(58, 217, 245, .07); box-shadow: inset 0 0 0 1px rgba(58, 217, 245, .5), 0 0 0 4px rgba(58, 217, 245, .08); }
.cm-pin .yc .tx { display: block; -webkit-line-clamp: unset; overflow: visible; }
.pin-x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .08); color: var(--mid); cursor: pointer; }
.pin-x:hover { background: rgba(255, 255, 255, .16); color: #fff; }
.pin-x svg { width: 10px; height: 10px; }
.cm-rows { grid-area: rows; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.row { display: flex; width: max-content; animation: mq var(--dur, 300s) linear infinite; }
.row.rev { animation-direction: reverse; }
.row .set { display: flex; }
.cm-rows:hover .row, .w-cm:hover .row { animation-play-state: paused; }
@keyframes mq { to { transform: translateX(-50%); } }
.cm-list { grid-area: list; display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px 8px; }
.cm-list .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.sent { height: 1px; grid-column: 1 / -1; grid-row: 9; }
.yc { --av: 36px; flex: none; width: 300px; height: 122px; margin-right: 8px; display: grid; grid-template-columns: var(--av) minmax(0, 1fr); gap: 12px; padding: 12px 14px 10px;
  border-radius: 12px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); font-family: var(--yt-font); color: #f1f1f1; text-align: left; }
.yc .bd { min-width: 0; display: flex; flex-direction: column; }
.yc .hd { font-size: 12.5px; font-weight: 500; line-height: 16px; letter-spacing: .01em; }
.yc .tx { margin: 2px 0 0; font-size: 14px; line-height: 20px; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.yc .ac { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 6px; }
.yc .ac svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
.yc .ct { font-size: 12px; color: #aaa; margin-right: 8px; font-variant-numeric: tabular-nums; }
.yc .dn { display: inline-flex; transform: rotate(180deg); }
.yc .rp { font-size: 12px; font-weight: 500; margin-left: 10px; }
#cm-rows .yc { height: var(--ch, 122px); }
#cm-rows .yc .tx { -webkit-line-clamp: var(--lines, 3); }
.cm-list .yc { width: auto; height: auto; margin: 0; }
.cm-list .yc .tx { display: block; -webkit-line-clamp: unset; overflow: visible; }

/* consistent focused action. */
.val { max-width: 780px; margin: 0 auto; padding: clamp(28px, 6cqw, 70px) clamp(22px, 5.5cqw, 56px) 64px; }
.bridge { margin: 0; font-size: clamp(17px, 2.6cqw, 21px); line-height: 1.55; color: var(--mid); }
.bridge2 { margin-top: .8em; }
.aside { font-size: .74em; color: var(--lo); }
.statement { margin: clamp(22px, 4cqw, 36px) 0 clamp(22px, 4cqw, 36px); font: 800 clamp(50px, 13.4cqw, 132px)/.9 var(--disp); letter-spacing: -.055em; }
.intro { margin: 0; font-size: clamp(16px, 2.4cqw, 19px); line-height: 1.62; color: var(--mid); max-width: 36em; }
.lockin { margin: clamp(44px, 8cqw, 72px) 0 20px; font: 700 clamp(24px, 4.4cqw, 38px)/1.14 var(--disp); letter-spacing: -.028em; max-width: 20em; }
.lockin em { font-style: italic; }
.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.step { border-bottom: 1px solid var(--hair); cursor: pointer; transition: background .2s; }
.step:not(.open):hover { background: rgba(255, 255, 255, .025); }
.step.open { cursor: auto; }
.step-h { display: grid; grid-template-columns: clamp(36px, 7cqw, 64px) minmax(0, 1fr); column-gap: 10px; width: 100%; padding: 20px 4px 20px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.step-h .n { grid-row: 1 / span 3; font: 700 clamp(20px, 3.2cqw, 28px)/1.1 var(--disp); color: var(--lo); font-variant-numeric: tabular-nums; }
.step-h .nm { font: 700 clamp(20px, 3.2cqw, 28px)/1.1 var(--disp); letter-spacing: -.024em; }
.step-h .ld { margin-top: 6px; font-size: clamp(15px, 2.3cqw, 17px); line-height: 1.5; color: var(--mid); }
.rm, .sl { justify-self: start; margin-top: 10px; padding: 0; border: 0; background: none; font: 600 14px/1.2 var(--sys); color: var(--text); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 4px; cursor: pointer; }
.step.open .rm { display: none; }
.step-b { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows .34s var(--ease), visibility 0s linear .34s; }
.step.open .step-b { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows .34s var(--ease); }
.step-b > div { overflow: hidden; padding-left: calc(clamp(36px, 7cqw, 64px) + 10px); }
.step-b p { margin: 0; font-size: clamp(15px, 2.3cqw, 17px); line-height: 1.65; color: rgba(245, 245, 247, .82); max-width: 38em; }
.sl { margin: 14px 0 22px; }

/* tools (inside the Finder) */
.tools { padding: clamp(22px, 4.4cqw, 44px); }
.tools-h h2 { font: 700 clamp(24px, 3.9cqw, 40px)/1.08 var(--disp); letter-spacing: -.03em; max-width: 22em; }
.tools-h p { margin: 10px 0 0; color: var(--mid); font-size: clamp(15px, 2cqw, 17px); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: clamp(20px, 3cqw, 30px); }
.tcard { position: relative; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, .035); }
.tcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); pointer-events: none; }
.vis { position: relative; height: 230px; display: grid; place-items: center; overflow: hidden; background: #000; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .06); }
.wk { position: absolute; inset: 24px 24px 0; width: calc(100% - 48px); height: calc(100% - 24px);
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent); mask-image: linear-gradient(180deg, #000 55%, transparent); }
.mc-sm { width: 112px; }
.fx { width: calc(100% - 44px); display: flex; flex-direction: column; align-items: flex-start; }
.fx .tag { font: 600 11.5px/1 var(--sys); padding: 6px 9px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--mid); }
.fx .lab { margin-top: 12px; font-size: 14px; color: var(--mid); }
.fx b { margin-top: 4px; font: 700 clamp(32px, 4.2cqw, 44px)/1.05 var(--disp); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.fx .bar { width: 100%; height: 6px; margin-top: 14px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.fx .bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
.fx .cap { margin-top: 10px; font-size: 13.5px; color: var(--mid); }
.tc-tx { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 18px 18px 20px; }
.tc-tx h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font: 700 21px/1.15 var(--disp); letter-spacing: -.02em; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 8px; border-radius: 999px; font: 600 11.5px/1 var(--sys); letter-spacing: 0; color: #b5f2bb; background: rgba(63, 217, 78, .12); box-shadow: inset 0 0 0 1px rgba(63, 217, 78, .22); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.desc { margin: 0; font-size: 15px; line-height: 1.5; color: var(--mid); }
.hint { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--lo); }
.cta { margin-top: auto; padding-top: 10px; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-weight: 600; text-decoration: none; }
.cta svg { width: 12px; height: 12px; transition: transform .15s var(--ease); }
.cta:hover svg { transform: translate(2px, -2px); }

/* finder chrome */
.w-tools .tb { height: 52px; justify-content: flex-start; padding: 0 12px 0 84px; }
.w-tools .ttl { font-size: 14px; font-weight: 700; color: var(--text); }
.fd-nav { display: flex; gap: 2px; margin-left: 4px; }
.fd-nav button, .fd-views button { width: 30px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: none; color: rgba(245, 245, 247, .78); display: grid; place-items: center; cursor: default; }
.fd-nav button svg { width: 14px; height: 14px; }
.fd-nav button:disabled { color: rgba(245, 245, 247, .22); }
.fd-nav button:not(:disabled):hover, .fd-views button:hover { background: rgba(255, 255, 255, .1); }
.fd-views { margin-left: auto; display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .1); }
.fd-views button { width: 32px; height: 24px; }
.fd-views button svg { width: 15px; height: 15px; }
.fd-views button.on { background: rgba(255, 255, 255, .17); color: #fff; }
.w-tools .body { overflow: hidden; container-type: normal; }
.fd { display: grid; grid-template-columns: 176px minmax(0, 1fr); height: 100%; }
.fd-side { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; background: rgba(255, 255, 255, .025); box-shadow: inset -1px 0 0 rgba(255, 255, 255, .06); overflow: auto; }
.fd-side button { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: rgba(245, 245, 247, .86); font: 500 13px/1 var(--sys); text-align: left; cursor: default; }
.fd-side button svg { width: 16px; height: 16px; color: var(--cyan); flex: none; }
.fd-side button:hover { background: rgba(255, 255, 255, .06); }
.fd-side button.on { background: rgba(255, 255, 255, .13); }
.fd-main { position: relative; overflow: auto; overscroll-behavior: contain; container-type: inline-size; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
.fd-icons { display: grid; grid-template-columns: repeat(auto-fill, 116px); gap: 18px 6px; padding: 24px; }
.fd-empty { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 40px; color: rgba(245, 245, 247, .4); font: 500 14px var(--sys); }
.fd-empty svg { width: 64px; height: 64px; color: rgba(245, 245, 247, .22); }
.fd-pane[data-pane="trash"] { height: 100%; }
.fd[data-view="list"] .tgrid { display: flex; flex-direction: column; gap: 0; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.fd[data-view="list"] .tcard { flex-direction: row; align-items: center; border-radius: 0; background: none; }
.fd[data-view="list"] .tcard:nth-child(even) { background: rgba(255, 255, 255, .03); }
.fd[data-view="list"] .tcard::after { display: none; }
.fd[data-view="list"] .tcard + .tcard { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.fd[data-view="list"] .vis { width: 176px; height: 126px; flex: none; margin: 12px 0 12px 12px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.fd[data-view="list"] .wk { inset: 12px 12px 0; width: calc(100% - 24px); height: calc(100% - 12px); }
.fd[data-view="list"] .mc-sm { width: 44px; }
.fd[data-view="list"] .t-freedom .fx { position: absolute; left: 50%; top: 50%; width: 300px; transform: translate(-50%, -50%) scale(.5); }
.fd[data-view="list"] .tc-tx { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 24px; row-gap: 5px; align-items: center; padding: 14px 20px; }
.fd[data-view="list"] .tc-tx h3 { grid-column: 1; font-size: 17px; }
.fd[data-view="list"] .desc, .fd[data-view="list"] .hint { grid-column: 1; }
.fd[data-view="list"] .desc { font-size: 14px; }
.fd[data-view="list"] .cta { grid-column: 2; grid-row: 1 / span 3; margin: 0; padding: 0; }
.fd[data-view="list"] .fd-icons { grid-template-columns: 1fr; gap: 0; padding: 14px 18px; }
.fd[data-view="list"] .fd-icons .di { flex-direction: row; gap: 12px; padding: 6px 8px; border-radius: 7px; }
.fd[data-view="list"] .fd-icons .di:nth-child(even) { background: rgba(255, 255, 255, .03); }
.fd[data-view="list"] .fd-icons .art { width: 32px; height: 32px; }
.fd[data-view="list"] .fd-icons .art > * { transform: scale(.5); }
.fd[data-view="list"] .fd-icons .lbl { text-shadow: none; }

/* 25+5 lessons */
.les { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: clamp(22px, 4.6cqw, 48px); padding: clamp(24px, 5cqw, 52px); min-height: 100%; }
.cover { position: relative; width: clamp(170px, 30cqw, 250px); aspect-ratio: 2 / 3; border-radius: 3px 10px 10px 3px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(18px, 3.4cqw, 26px);
  background: radial-gradient(110% 65% at 28% 16%, rgba(58, 217, 245, .2), rgba(58, 217, 245, 0) 62%), #040506;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .11), 0 28px 60px rgba(0, 0, 0, .65), 0 6px 14px rgba(0, 0, 0, .45); }
.cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: linear-gradient(90deg, rgba(255, 255, 255, .09), rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, 0)); }
.cover .big { font: 800 clamp(58px, 10.5cqw, 88px)/.88 var(--disp); letter-spacing: -.06em; }
.cover .big span { color: var(--cyan); }
.cover .small { margin-top: 12px; font: 600 clamp(12px, 1.9cqw, 14px)/1.3 var(--sys); }
.les-tx h3 { font: 700 clamp(22px, 4cqw, 34px)/1.1 var(--disp); letter-spacing: -.026em; }
.les-tx > p:first-of-type { margin: 12px 0 0; font-size: clamp(15px, 2.3cqw, 17px); line-height: 1.55; color: var(--mid); }
@container (max-width: 560px) { .les { grid-template-columns: 1fr; align-content: start; min-height: 0; } .cover { width: min(200px, 56%); padding: 18px; } }

/* memento */
.mem { display: flex; flex-direction: column; min-height: 100%; }
.mem-stage { order: -1; display: grid; place-items: center; padding: 58px 24px; }
.mem-card { width: clamp(150px, 38cqw, 250px); }
.mem-tx { padding: 0 clamp(22px, 5.4cqw, 48px) 40px; }
.mem-tx h2 { font: 700 clamp(26px, 6.4cqw, 52px)/1.04 var(--disp); letter-spacing: -.034em; margin-bottom: 16px; }
.mem-tx p { margin: 0 0 14px; font-size: clamp(15px, 2.4cqw, 18px); line-height: 1.6; color: var(--mid); }
.see { display: inline-block; margin-top: 18px; font-weight: 600; color: var(--text); text-decoration: underline; text-decoration-color: var(--cyan); text-decoration-thickness: 2px; text-underline-offset: 4px; }
@container (min-width: 760px) {
  .mem { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .92fr); align-items: center; }
  .mem-stage { order: 0; padding: 90px 40px; }
  .mem-card { width: clamp(220px, 27cqw, 380px); }
  .mem-tx { padding: 48px 0 48px clamp(32px, 5cqw, 64px); }
}

/* get memento (footer) */
.foot { padding: clamp(24px, 5.4cqw, 48px); }
.foot h2 { font: 700 clamp(24px, 5.4cqw, 40px)/1.08 var(--disp); letter-spacing: -.03em; }
.flinks { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 30px; padding-top: 22px; box-shadow: inset 0 1px 0 var(--hair); }
.flinks a { font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .3); text-underline-offset: 4px; }
.flinks a:hover { text-decoration-color: var(--cyan); }
.foot .btn.dc { margin-top: 18px; }
.tagline { margin: 18px 0 0; font-size: 14px; color: var(--lo); }

/* the real Memento card (memento-card.js) */
.mcard { position: relative; width: 100%; aspect-ratio: 320 / 452; border-radius: 14px; }
.mcard__gl { position: absolute; display: block; pointer-events: none; }
.mcard--nogl { background: linear-gradient(165deg, #101418, #07090c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.mcard__m { position: absolute; left: 50%; top: 50%; width: 37%; transform: translate(-50%, -50%); pointer-events: none; fill: rgba(236, 240, 246, .62); filter: drop-shadow(0 1.5px 0 rgba(255, 255, 255, .30)) drop-shadow(0 -1.5px .75px rgba(0, 0, 0, .60)); }
.mcard--darkmark .mcard__m { filter: drop-shadow(0 1.5px 0 rgba(255, 255, 255, .75)) drop-shadow(0 -1.5px .75px rgba(0, 0, 0, .30)); }
.mcard__name, .mcard__cortex { display: none; }

/* ===== notifications (comment banners) */
.notes { position: fixed; top: calc(var(--mb) + 10px); right: 12px; width: 360px; z-index: 960; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.nt { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 11px; align-items: start; padding: 12px 14px 12px 12px; border-radius: 16px; text-align: left; color: #fff; cursor: default;
  background: var(--glass); -webkit-backdrop-filter: blur(40px) saturate(1.9); backdrop-filter: blur(40px) saturate(1.9);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2), 0 0 0 .5px rgba(0, 0, 0, .55), 0 14px 40px rgba(0, 0, 0, .45); }
.notes .nt { pointer-events: auto; }
.nt-av { --av: 38px; position: relative; }
.nt-app { position: absolute; right: -5px; bottom: -5px; width: 19px; height: 19px; border-radius: 5px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, #2a2a30, #0c0c0e); box-shadow: 0 0 0 1.5px rgba(30, 30, 34, .95), inset 0 0 0 .5px rgba(255, 255, 255, .2); }
.nt-app svg { width: 12px; height: 12px; }
.nt-b { min-width: 0; display: block; }
.nt-h { display: flex; align-items: baseline; gap: 8px; }
.nt-h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13.5px/1.3 var(--sys); }
.nt-h span { font: 400 12px/1 var(--sys); color: rgba(255, 255, 255, .55); }
.nt-p { display: -webkit-box; margin-top: 2px; font: 400 13.5px/1.36 var(--sys); color: rgba(255, 255, 255, .9); -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.nt-x { position: absolute; left: -7px; top: -7px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; cursor: default; opacity: 0;
  background: rgba(70, 70, 76, .94); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .25), 0 2px 6px rgba(0, 0, 0, .4); transition: opacity .15s; }
.nt-x svg { width: 8px; height: 8px; }
.nt:hover .nt-x, .nt:focus-within .nt-x { opacity: 1; }
.nt:hover { background: rgba(44, 44, 50, .68); }

/* ===== Spotlight */
.spot { position: fixed; inset: 0; z-index: 4500; }
.sp-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .16); }
.sp-panel { position: absolute; left: 50%; top: 20vh; width: min(680px, calc(100vw - 40px)); transform: translateX(-50%); border-radius: 18px; overflow: hidden;
  background: rgba(32, 32, 37, .72); -webkit-backdrop-filter: blur(50px) saturate(1.9); backdrop-filter: blur(50px) saturate(1.9);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .24), 0 0 0 .5px rgba(0, 0, 0, .7), 0 30px 90px rgba(0, 0, 0, .6); }
.sp-field { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 20px; }
.sp-field > svg { width: 22px; height: 22px; flex: none; color: rgba(245, 245, 247, .6); }
.sp-field input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; color: var(--text); font: 400 23px/1 var(--disp); letter-spacing: -.01em; outline: none; -webkit-appearance: none; appearance: none; }
.sp-field input::placeholder { color: rgba(245, 245, 247, .38); }
.sp-field input::-webkit-search-cancel-button { display: none; }
.sp-cancel { display: none; }
.sp-box { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; }
.sp-box svg { display: none; }
.sp-res { max-height: min(54vh, 470px); overflow: auto; padding: 6px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent; }
.sp-res:empty { display: none; }
.sp-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 7px 10px; border: 0; border-radius: 9px; background: none; text-align: left; color: var(--text); cursor: default; }
.sp-row.act { background: rgba(255, 255, 255, .13); }
.sp-row .ico { --ic: 30px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.sp-row .sprite { --av: 30px; }
.sp-row .sp-n { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font: 700 14px var(--disp); color: var(--green); background: linear-gradient(180deg, #26262b, #09090b); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.sp-txt { min-width: 0; }
.sp-t { display: block; font: 500 14px/1.3 var(--sys); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-s { display: block; margin-top: 1px; font: 12.5px/1.35 var(--sys); color: rgba(245, 245, 247, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-k { font: 12px var(--sys); color: rgba(245, 245, 247, .42); white-space: nowrap; }
.sp-row mark { background: none; color: #fff; font-weight: 700; }
.sp-none { padding: 22px; text-align: center; color: rgba(245, 245, 247, .45); font-size: 14px; }

/* ===== lock screen */
.lock { position: fixed; inset: 0; z-index: 5000; color: #fff; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; outline: none;
  background: radial-gradient(100% 55% at 50% 100%, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0) 70%); }
.lk-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.lk-top { margin-top: calc(var(--safe-t) + 8vh); text-align: center; }
.lk-date { font: 600 clamp(18px, 1.7vw, 26px)/1.2 var(--disp); color: rgba(255, 255, 255, .88); letter-spacing: .005em; text-shadow: 0 1px 12px rgba(0, 0, 0, .25); }
.lk-time { margin-top: 2px; font: 700 clamp(96px, 10.5vw, 176px)/1 var(--round); letter-spacing: -.035em; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .95); text-shadow: 0 2px 40px rgba(0, 0, 0, .22); }
.lk-user { margin-top: auto; margin-bottom: calc(var(--safe-b) + max(11vh, 96px)); display: flex; flex-direction: column; align-items: center; gap: 9px; }
.lk-av { width: 76px; height: 76px; padding: 6px; border-radius: 50%; object-fit: contain; background: rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), 0 12px 34px rgba(0, 0, 0, .45); }
.lk-name { font: 600 15px/1.2 var(--sys); text-shadow: 0 1px 10px rgba(0, 0, 0, .4); }
.lk-hint { padding: 7px 14px; border-radius: 999px; font: 500 12.5px/1 var(--sys); color: rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .08); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .16); }
.lk-notes, .lk-swipe { display: none; }
html.locked .menubar, html.locked .dk-d, html.locked .icons, html.locked .win, html.locked .notes, html.locked #home, html.locked .dk-p, html.locked .pbar, html.locked .pfade { visibility: hidden; }

/* ===== PHONE: an iPhone home screen. Apps open full screen. */
@media (max-width: 899px), (max-height: 500px) and (pointer: coarse) {
  :root { --ic: 60px; --glass: rgba(26, 30, 34, .56); --hdr: calc(var(--safe-t) + 52px); --pb: calc(var(--dock-b) + 98px); }

  /* ---------- live clock (menu bar + lock screen) */

  }
  (function loop() { tick(); setTimeout(loop, 60000 - (Date.now() % 60000) + 50); })();

  /* ---------- wallpapers: drawn here once (seeded, so every load looks the same) */
  function seeded(a) { return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    });

      g = x.createRadialGradient(p[0] - p[2] * 0.15, p[1] - p[2] * 0.2, 0, p[0], p[1], p[2]);
      g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(0.5, 'rgba(255,255,255,.26)'); g.addColorStop(1, 'rgba(255,255,255,0)');

  }
  function paintHills(x, w, h, R) {
    var u = Math.max(w, h * 1.6) / 1600, g, i;
    g = x.createLinearGradient(0, 0, 0, h * 0.7);
    g.addColorStop(0, '#1752bd'); g.addColorStop(0.42, '#357cdb'); g.addColorStop(0.8, '#86bcf0'); g.addColorStop(1, '#c2ddf8');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    g = x.createRadialGradient(w * 0.86, -h * 0.1, 0, w * 0.86, -h * 0.1, w * 0.7);
    g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    [[0.12, 0.16, 1.1], [0.46, 0.08, 0.72], [0.76, 0.2, 1.3], [0.3, 0.34, 0.6], [0.95, 0.07, 0.55], [0.6, 0.35, 0.48], [0.04, 0.4, 0.5]].forEach(function (c) { cloud(x, c[0] * w, c[1] * h, c[2] * u, R); });
    /* the far hill, softened by haze */
    var back = new Path2D();
    back.moveTo(0, h * 0.7); back.bezierCurveTo(w * 0.28, h * 0.64, w * 0.48, h * 0.57, w * 0.7, h * 0.575); back.bezierCurveTo(w * 0.86, h * 0.58, w * 0.95, h * 0.6, w, h * 0.6); back.lineTo(w, h); back.lineTo(0, h); back.closePath();

    x.fillStyle = g; x.fillRect(0, 0, w, h);
    g = x.createRadialGradient(w * 0.92, h * 1.05, 0, w * 0.92, h * 1.05, w * 0.62); g.addColorStop(0, 'rgba(12,45,8,.42)'); g.addColorStop(1, 'rgba(12,45,8,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (i = 0; i < 26; i++) {
      var bx = R() * w, by = h * 0.56 + R() * h * 0.44, br = (80 + R() * 220) * u, dk = R() < 0.55;
      g = x.createRadialGradient(bx, by, 0, bx, by, br); g.addColorStop(0, dk ? 'rgba(20,70,12,.12)' : 'rgba(200,240,120,.1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(bx - br, by - br, br * 2, br * 2);

    }

    x.strokeStyle = 'rgba(22,78,14,.2)'; x.stroke(dark);
    x.strokeStyle = 'rgba(196,238,118,.14)'; x.stroke(lite);
    x.lineWidth = 3 * u; x.strokeStyle = 'rgba(210,248,140,.28)'; x.stroke(hill);

  function paintRain(x, w, h, R, d) {
    var S = [[0, [22, 88, 100]], [0.32, [56, 126, 134]], [0.64, [148, 176, 180]], [1, [212, 219, 221]]], g, i;

    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (i = 0; i < 12; i++) {
      var bx = R() * w, by = R() * h, br = (60 + R() * 150) * d, lt = R() < 0.6;
      g = x.createRadialGradient(bx, by, 0, bx, by, br); g.addColorStop(0, lt ? 'rgba(255,255,255,.09)' : 'rgba(10,50,58,.1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(bx - br, by - br, br * 2, br * 2);

      x.beginPath(); x.ellipse(-rx * 0.07, -ry * 0.09, rx * 1.04, ry * 1.04, 0, 0, 6.2832);
      x.fillStyle = 'rgba(4,30,36,' + (big ? 0.5 : 0.34) + ')'; x.fill();

      gb = x.createLinearGradient(0, -ry, 0, ry); gb.addColorStop(0, rgba(top, 1)); gb.addColorStop(1, rgba(bot, 1));
      x.fillStyle = gb; x.fill();

        x.fillStyle = gb; x.fill();
        x.beginPath(); x.ellipse(rx * 0.08, ry * 0.12, rx * 0.98, ry * 0.95, 0, 0.15, 2.6);
        x.lineWidth = Math.max(0.6 * d, rx * 0.09); x.strokeStyle = 'rgba(255,255,255,.28)'; x.stroke();

      x.fillStyle = 'rgba(255,255,255,' + (big ? 0.92 : 0.7) + ')'; x.fill();
      x.restore();
    });
  }
  var wallCv = $('#wall'), wallKey = '';
  /* the home screen scrolls between the header and the dock; its edges fade into a copy of the wallpaper */
  function paintFades() {
    if (!phone || !wallCv.width) return;
    var hr = $('#home').getBoundingClientRect(), W = window.innerWidth, d = wallCv.width / W;
    [[$('#wf-top'), 0, hr.top + 12, 1], [$('#wf-bot'), hr.bottom - 22, 22, 0]].forEach(function (f) {
      var cv = f[0], y = Math.max(0, f[1]), hh = Math.max(1, f[2]);
